<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>中文默字练习（iPad手写版）</title>

<style>

body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding:20px;
    margin:0;
}

h1{
    font-size:42px;
    margin-bottom:20px;
}

textarea{
    width:90%;
    height:120px;
    font-size:28px;
    padding:15px;
    border-radius:16px;
    border:2px solid #ccc;
}

button{
    font-size:28px;
    padding:18px 28px;
    margin:10px;
    border:none;
    border-radius:18px;
    background:#007aff;
    color:white;
}

button:active{
    transform:scale(0.97);
}

#practiceArea{
    display:none;
    margin-top:20px;
}

#promptArea{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:100px;
    margin-top:30px;
    flex-wrap:wrap;
}

.bigWord{
    font-size:48px;
    width:420px;
    height:320px;
    background:white;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    border:3px solid #ccc;
}

#canvasContainer{
    position:relative;
}

canvas{
    width:420px;
    height:320px;
    background:white;
    border:3px solid #333;
    border-radius:20px;
    touch-action:none;
}

#currentIndex{
    font-size:28px;
    margin-top:10px;
}

#wrongWordsDisplay{
    margin-top:30px;
    font-size:36px;
    color:red;
    line-height:1.8;
    white-space:pre-wrap;
}

#answerInput{
    margin-top:30px;
    font-size:42px;
    width:300px;
    padding:15px;
    text-align:center;
    border-radius:16px;
    border:2px solid #aaa;
}

@media (max-width:1200px){

    #promptArea{
        flex-direction:column;
        gap:40px;
    }

}

</style>
</head>

<body>

<h1>中文默字练习</h1>

<div id="setupArea">

<textarea id="wordInput"
placeholder="请输入词语，用空格、逗号、句号等分隔"></textarea>

<br>

<button onclick="startPractice()">开始</button>

</div>

<div id="practiceArea">

<div id="currentIndex"></div>

<div id="promptArea">

<div class="bigWord" id="targetWord"></div>

<div id="canvasContainer">
<canvas id="writingCanvas" width="420" height="320"></canvas>
</div>

</div>

<div style="margin-top:25px;">

<input id="answerInput" placeholder="输入你写的词">

</div>

<div>

<button onclick="submitAnswer()">提交</button>

<button onclick="repeatWord()">再念一次</button>

<button onclick="recordWrongWord()">记录错字</button>

<button onclick="showWrongWords()">显示错字</button>

<button onclick="clearCanvas()">清空手写</button>

<button onclick="resetAll()">Reset</button>

</div>

<div id="wrongWordsDisplay"></div>

</div>

<script>

let words = [];
let currentIndex = 0;
let currentWord = "";
let wrongWords = [];

const synth = window.speechSynthesis;

function splitWords(text){

    return text
        .split(/[\s，。,；：！？、]+/)
        .map(w => w.trim())
        .filter(w => w.length > 0);

}

function speak(text){

    synth.cancel();

    const utter = new SpeechSynthesisUtterance(text);

    utter.lang = "zh-CN";

    utter.rate = 0.5;

    synth.speak(utter);

}

function startPractice(){

    const input = document.getElementById("wordInput").value;

    words = splitWords(input);

    if(words.length === 0){
        alert("请输入词语");
        return;
    }

    currentIndex = 0;

    document.getElementById("setupArea").style.display = "none";

    document.getElementById("practiceArea").style.display = "block";

    loadCurrentWord();

}

function loadCurrentWord(){

    if(currentIndex >= words.length){

        document.getElementById("targetWord").innerText = "";

        document.getElementById("currentIndex").innerText = "已完成";

        return;
    }

    currentWord = words[currentIndex];

    document.getElementById("targetWord").innerText = "";

    document.getElementById("answerInput").value = "";

    clearCanvas();

    document.getElementById("currentIndex").innerText =
        `第 ${currentIndex + 1} / ${words.length} 个`;

    speak(currentWord);

}

function submitAnswer(){

    const userAnswer =
        document.getElementById("answerInput").value.trim();

    document.getElementById("targetWord").innerText = currentWord;

    currentIndex++;

    setTimeout(() => {
        loadCurrentWord();
    }, 1500);

}

function repeatWord(){

    speak(currentWord);

}

function recordWrongWord(){

    if(!wrongWords.includes(currentWord)){
        wrongWords.push(currentWord);
    }

}

function showWrongWords(){

    const area = document.getElementById("wrongWordsDisplay");

    if(wrongWords.length === 0){

        area.innerText = "暂无错字";

    }else{

        area.innerText =
            "错字组：\n\n" + wrongWords.join("    ");

    }

}

function resetAll(){

    // 把当前错字组保存
    const previousWrongWords = [...wrongWords];

    // 输入框显示上一轮错字
    document.getElementById("wordInput").value =
        previousWrongWords.join(" ");

    // 清空当前状态
    words = [];
    currentIndex = 0;
    currentWord = "";

    // 清空错字组（开始新一轮）
    wrongWords = [];

    document.getElementById("wrongWordsDisplay").innerText = "";

    document.getElementById("setupArea").style.display = "block";

    document.getElementById("practiceArea").style.display = "none";

    synth.cancel();

}

const canvas = document.getElementById("writingCanvas");
const ctx = canvas.getContext("2d");

ctx.lineWidth = 8;
ctx.lineCap = "round";

let drawing = false;

function getPos(e){

    const rect = canvas.getBoundingClientRect();

    if(e.touches){

        return {
            x:e.touches[0].clientX - rect.left,
            y:e.touches[0].clientY - rect.top
        };

    }else{

        return {
            x:e.clientX - rect.left,
            y:e.clientY - rect.top
        };

    }

}

function startDraw(e){

    drawing = true;

    const pos = getPos(e);

    ctx.beginPath();

    ctx.moveTo(pos.x, pos.y);

}

function draw(e){

    if(!drawing) return;

    e.preventDefault();

    const pos = getPos(e);

    ctx.lineTo(pos.x, pos.y);

    ctx.stroke();

}

function endDraw(){

    drawing = false;

}

canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", endDraw);

canvas.addEventListener("touchstart", startDraw);
canvas.addEventListener("touchmove", draw);
canvas.addEventListener("touchend", endDraw);

function clearCanvas(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

}

</script>

</body>
</html>
